name: Continuous Deployment (Hostinger)

on:
  push:
    branches: [main, master]
    paths:
      - 'front/**'
      - 'frontend/**'
      - 'backend-php/**'
      - 'backend/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Componente a desplegar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - backend
          - ssh-check

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. SSH CHECK & REMOTE PATH RESOLUTION
  # ──────────────────────────────────────────────────────────
  ssh-check:
    name: SSH Connectivity & Path Detection
    runs-on: ubuntu-latest
    outputs:
      doc_root: ${{ steps.detect.outputs.doc_root }}
      backend_path: ${{ steps.detect.outputs.backend_path }}
      base_path: ${{ steps.detect.outputs.base_path }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: Install SSH client & tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass openssh-client

      - name: Configure SSH Authentication
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_hostinger
            chmod 600 ~/.ssh/id_hostinger
            SSH_AUTH_CONFIG="IdentityFile ~/.ssh/id_hostinger"
          fi
          {
            echo "Host production"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  LogLevel ERROR"
            if [ -n "$SSH_AUTH_CONFIG" ]; then
              echo "  $SSH_AUTH_CONFIG"
            fi
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Test Remote Connection & Resolve Paths
        id: detect
        run: |
          RUN_SSH() {
            if [ -n "$SSH_KEY" ]; then
              ssh production "$@"
            else
              sshpass -p "$SSH_PASSWORD" ssh production "$@"
            fi
          }

          echo "Probando conexión SSH con Hostinger..."
          RUN_SSH "echo 'SSH exitoso.'"

          DETECT_SCRIPT='
            USER_HOME=$(pwd -P)
            echo "=== ESTRUCTURA DEL SERVIDOR ==="
            ls -la "$USER_HOME"
            if [ -d "$USER_HOME/domains" ]; then
              echo "--- DIRECTORIO domains ---"
              ls -la "$USER_HOME/domains"
            fi

            # 1. Prioridad: ¿Existe carpeta de subdominio catalogo.tiendaintima.com?
            DOC_ROOT=""
            if [ -d "$USER_HOME/domains/catalogo.tiendaintima.com/public_html" ]; then
              DOC_ROOT="$USER_HOME/domains/catalogo.tiendaintima.com/public_html"
            elif [ -d "$USER_HOME/domains/tiendaintima.com/public_html/catalogo" ]; then
              DOC_ROOT="$USER_HOME/domains/tiendaintima.com/public_html/catalogo"
            elif [ -d "$USER_HOME/public_html/catalogo" ]; then
              DOC_ROOT="$USER_HOME/public_html/catalogo"
            fi

            # 2. Si no se encontró por nombre fijo, buscar carpeta con nombre catalogo
            if [ -z "$DOC_ROOT" ]; then
              FOUND_CAT=$(find "$USER_HOME" -maxdepth 4 -type d \( -name "catalogo" -o -name "catalogo.tiendaintima.com" \) 2>/dev/null | head -n 1)
              if [ -n "$FOUND_CAT" ]; then
                if [ -d "$FOUND_CAT/public_html" ]; then
                  DOC_ROOT="$FOUND_CAT/public_html"
                else
                  DOC_ROOT="$FOUND_CAT"
                fi
              fi
            fi

            # 3. Si aún no existe, verificar si existe dominio tiendaintima.com
            if [ -z "$DOC_ROOT" ]; then
              if [ -d "$USER_HOME/domains/tiendaintima.com/public_html" ]; then
                mkdir -p "$USER_HOME/domains/tiendaintima.com/public_html/catalogo"
                DOC_ROOT="$USER_HOME/domains/tiendaintima.com/public_html/catalogo"
              elif [ -d "$USER_HOME/public_html" ]; then
                DOC_ROOT="$USER_HOME/public_html"
              fi
            fi

            # 4. Fallback final seguro
            if [ -z "$DOC_ROOT" ]; then
              DOC_ROOT="$USER_HOME/public_html"
            fi

            BACKEND_DIR="$USER_HOME/backend_php"
            mkdir -p "$DOC_ROOT" "$BACKEND_DIR"

            echo "DOC_ROOT_RESULT=$DOC_ROOT"
            echo "BACKEND_PATH_RESULT=$BACKEND_DIR"
            echo "BASE_PATH_RESULT=$USER_HOME"
          '

          RAW_OUTPUT=$(if [ -n "$SSH_KEY" ]; then
            ssh production "bash -s" <<< "$DETECT_SCRIPT"
          else
            sshpass -p "$SSH_PASSWORD" ssh production "bash -s" <<< "$DETECT_SCRIPT"
          fi)

          echo "Salida cruda del servidor:"
          echo "$RAW_OUTPUT"

          DOC_ROOT=$(echo "$RAW_OUTPUT" | grep 'DOC_ROOT_RESULT=' | tail -n 1 | cut -d '=' -f 2- | tr -d '\r\n ')
          BACKEND_PATH=$(echo "$RAW_OUTPUT" | grep 'BACKEND_PATH_RESULT=' | tail -n 1 | cut -d '=' -f 2- | tr -d '\r\n ')
          BASE_PATH=$(echo "$RAW_OUTPUT" | grep 'BASE_PATH_RESULT=' | tail -n 1 | cut -d '=' -f 2- | tr -d '\r\n ')

          if [ -z "$DOC_ROOT" ] || [ "$DOC_ROOT" = "/" ]; then
            DOC_ROOT="/home/$SSH_USER/public_html"
          fi
          if [ -z "$BACKEND_PATH" ] || [ "$BACKEND_PATH" = "/" ]; then
            BACKEND_PATH="/home/$SSH_USER/backend_php"
          fi
          if [ -z "$BASE_PATH" ] || [ "$BASE_PATH" = "/" ]; then
            BASE_PATH="/home/$SSH_USER"
          fi

          echo "Doc Root Resuelto: '$DOC_ROOT'"
          echo "Backend Path Resuelto: '$BACKEND_PATH'"
          echo "Base Path Resuelto: '$BASE_PATH'"

          # Verificación de seguridad estricta
          if [ -z "$DOC_ROOT" ] || [ "$DOC_ROOT" = "/" ] || [ "$DOC_ROOT" = "." ]; then
            echo "::error::DOC_ROOT inválido: '$DOC_ROOT'. Abortando."
            exit 1
          fi

          RUN_SSH "mkdir -p '$DOC_ROOT' '$BACKEND_PATH'"

          echo "doc_root=$DOC_ROOT" >> "$GITHUB_OUTPUT"
          echo "backend_path=$BACKEND_PATH" >> "$GITHUB_OUTPUT"
          echo "base_path=$BASE_PATH" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────
  # 2. PATHS FILTER (Detectar qué cambió)
  # ──────────────────────────────────────────────────────────
  changes:
    name: Detect Changed Paths
    needs: ssh-check
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Evaluate Component Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'front/**'
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            backend:
              - 'backend-php/**'
              - 'backend/**'
              - '.github/scripts/**'
              - '.github/workflows/deploy.yml'

  # ──────────────────────────────────────────────────────────
  # 3. DEPLOY FRONTEND (SPA)
  # ──────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (SPA)
    needs: [ssh-check, changes]
    if: |
      needs.changes.outputs.frontend == 'true' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'frontend' ||
      (github.event_name == 'push' && needs.changes.outputs.backend != 'true')
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      DOC_ROOT: ${{ needs.ssh-check.outputs.doc_root }}
      BASE_PATH: ${{ needs.ssh-check.outputs.base_path }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Frontend Directory
        id: locate
        run: |
          if [ -d "front" ]; then
            echo "dir=front" >> $GITHUB_OUTPUT
          elif [ -d "frontend" ]; then
            echo "dir=frontend" >> $GITHUB_OUTPUT
          else
            echo "::error::No se encontró directorio frontend."
            exit 1
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ steps.locate.outputs.dir }}/package-lock.json

      - name: Install NPM Dependencies
        run: |
          cd ${{ steps.locate.outputs.dir }}
          npm ci --prefer-offline

      - name: Build Frontend (Production)
        run: |
          cd ${{ steps.locate.outputs.dir }}
          npm run build -- --configuration production

      - name: Install SSH and Rsync tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync openssh-client

      - name: Configure SSH Host Profile
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_hostinger
            chmod 600 ~/.ssh/id_hostinger
            SSH_AUTH_CONFIG="IdentityFile ~/.ssh/id_hostinger"
          fi
          {
            echo "Host production"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  LogLevel ERROR"
            if [ -n "$SSH_AUTH_CONFIG" ]; then
              echo "  $SSH_AUTH_CONFIG"
            fi
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy Frontend via Rsync (Protegiendo API Bridge)
        run: |
          RUN_RSYNC() {
            if [ -n "$SSH_KEY" ]; then
              rsync "$@"
            else
              sshpass -p "$SSH_PASSWORD" rsync "$@"
            fi
          }

          TARGET_DOCROOT="${DOC_ROOT:-/home/$SSH_USER/public_html}"
          if [ -z "$TARGET_DOCROOT" ] || [ "$TARGET_DOCROOT" = "/" ] || [ "$TARGET_DOCROOT" = "." ]; then
            echo "::error::TARGET_DOCROOT inválido: '$TARGET_DOCROOT'. Abortando."
            exit 1
          fi

          FDIR="${{ steps.locate.outputs.dir }}"
          DIST_DIR="$FDIR/dist/front/browser"
          if [ ! -d "$DIST_DIR" ]; then
            DIST_DIR="$FDIR/dist/frontend/browser"
          fi
          if [ ! -d "$DIST_DIR" ]; then
            DIST_DIR="$FDIR/dist/browser"
          fi
          if [ ! -d "$DIST_DIR" ]; then
            DIST_DIR="$FDIR/dist/front"
          fi
          if [ ! -d "$DIST_DIR" ]; then
            DIST_DIR="$FDIR/dist/frontend"
          fi
          if [ ! -d "$DIST_DIR" ]; then
            DIST_DIR="$FDIR/dist"
          fi

          echo "Directorio de compilación detectado: $DIST_DIR"
          echo "Sincronizando frontend hacia $TARGET_DOCROOT/..."

          # Sincronizar hacia DOC_ROOT protegiendo el API Bridge
          RUN_RSYNC -avz --delete \
            --filter='protect /api' \
            --filter='protect /api/**' \
            --filter='protect /backend_php' \
            --filter='protect /backend_php/**' \
            "$DIST_DIR/" production:"$TARGET_DOCROOT/"

          if [ -f "$FDIR/public/.htaccess" ]; then
            RUN_RSYNC -avz "$FDIR/public/.htaccess" production:"$TARGET_DOCROOT/.htaccess"
          fi

          # Si DOC_ROOT es una subcarpeta (ej. public_html/catalogo), copiar también a public_html/
          MAIN_PUB="/home/$SSH_USER/public_html"
          if [ "$TARGET_DOCROOT" != "$MAIN_PUB" ]; then
            echo "Sincronizando también copia a $MAIN_PUB/..."
            RUN_RSYNC -avz \
              --filter='protect /api' \
              --filter='protect /api/**' \
              --filter='protect /backend_php' \
              --filter='protect /backend_php/**' \
              "$DIST_DIR/" production:"$MAIN_PUB/" || true
            if [ -f "$FDIR/public/.htaccess" ]; then
              RUN_RSYNC -avz "$FDIR/public/.htaccess" production:"$MAIN_PUB/.htaccess" || true
            fi
          fi

          echo "Frontend sincronizado exitosamente."

  # ──────────────────────────────────────────────────────────
  # 4. DEPLOY BACKEND (PHP Core Fuera de public_html + API Bridge)
  # ──────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend & API Bridge
    needs: [ssh-check, changes]
    if: |
      needs.changes.outputs.backend == 'true' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'backend' ||
      (github.event_name == 'push' && needs.changes.outputs.frontend != 'true')
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DOC_ROOT: ${{ needs.ssh-check.outputs.doc_root }}
      BACKEND_PATH: ${{ needs.ssh-check.outputs.backend_path }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Backend Directory
        id: locate
        run: |
          if [ -d "backend-php" ]; then
            echo "dir=backend-php" >> $GITHUB_OUTPUT
          elif [ -d "backend" ]; then
            echo "dir=backend" >> $GITHUB_OUTPUT
          else
            echo "::error::No se encontró directorio backend."
            exit 1
          fi

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, json, curl
          coverage: none

      - name: Install Composer Dependencies (Production)
        run: |
          cd ${{ steps.locate.outputs.dir }}
          composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Validate No .env In Repository
        run: |
          BDIR="${{ steps.locate.outputs.dir }}"
          if git ls-files --error-unmatch "$BDIR/.env" 2>/dev/null; then
            echo "::error::Archivo $BDIR/.env rastreado en Git. Deteniendo por seguridad."
            exit 1
          fi

      - name: Install SSH and Rsync tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync openssh-client

      - name: Configure SSH Host Profile
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_hostinger
            chmod 600 ~/.ssh/id_hostinger
            SSH_AUTH_CONFIG="IdentityFile ~/.ssh/id_hostinger"
          fi
          {
            echo "Host production"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  LogLevel ERROR"
            if [ -n "$SSH_AUTH_CONFIG" ]; then
              echo "  $SSH_AUTH_CONFIG"
            fi
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy Backend Core to Isolated Directory
        run: |
          RUN_RSYNC() {
            if [ -n "$SSH_KEY" ]; then
              rsync "$@"
            else
              sshpass -p "$SSH_PASSWORD" rsync "$@"
            fi
          }

          TARGET_BACKEND="${BACKEND_PATH:-/home/$SSH_USER/backend_php}"
          if [ -z "$TARGET_BACKEND" ] || [ "$TARGET_BACKEND" = "/" ] || [ "$TARGET_BACKEND" = "." ]; then
            echo "::error::TARGET_BACKEND inválido: '$TARGET_BACKEND'. Abortando."
            exit 1
          fi

          BDIR="${{ steps.locate.outputs.dir }}"
          echo "Desplegando en carpeta privada $TARGET_BACKEND/..."
          RUN_RSYNC -avz --delete \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='uploads/' \
            --exclude='.git*' \
            "$BDIR/" production:"$TARGET_BACKEND/"

      - name: Configure Remote .env, Generate API Bridge & Migrate
        run: |
          TARGET_DOCROOT="${DOC_ROOT:-/home/$SSH_USER/public_html}"
          TARGET_BACKEND="${BACKEND_PATH:-/home/$SSH_USER/backend_php}"

          chmod +x .github/scripts/remote-deploy.sh
          if [ -n "$SSH_KEY" ]; then
            ssh production "bash -s -- '$TARGET_BACKEND' '$TARGET_DOCROOT' '$DB_NAME' '$DB_USER' '$DB_PASSWORD'" < .github/scripts/remote-deploy.sh
          else
            sshpass -p "$SSH_PASSWORD" ssh production "bash -s -- '$TARGET_BACKEND' '$TARGET_DOCROOT' '$DB_NAME' '$DB_USER' '$DB_PASSWORD'" < .github/scripts/remote-deploy.sh
          fi

          # Si DOC_ROOT es subcarpeta, configurar también el puente en public_html principal
          MAIN_PUB="/home/$SSH_USER/public_html"
          if [ "$TARGET_DOCROOT" != "$MAIN_PUB" ]; then
            if [ -n "$SSH_KEY" ]; then
              ssh production "bash -s -- '$TARGET_BACKEND' '$MAIN_PUB' '$DB_NAME' '$DB_USER' '$DB_PASSWORD'" < .github/scripts/remote-deploy.sh || true
            else
              sshpass -p "$SSH_PASSWORD" ssh production "bash -s -- '$TARGET_BACKEND' '$MAIN_PUB' '$DB_NAME' '$DB_USER' '$DB_PASSWORD'" < .github/scripts/remote-deploy.sh || true
            fi
          fi

      - name: Verify Live API Health
        run: |
          echo "Verificando endpoint de salud de la API..."
          sleep 3
          HEALTH_URL="https://catalogo.tiendaintima.com/api/health"
          echo "Probando: $HEALTH_URL"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
          echo "HTTP Status Code: $STATUS_CODE"

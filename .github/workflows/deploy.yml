name: Continuous Deployment (Hostinger)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Componente a desplegar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - backend

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. SSH CHECK & PATH SETUP
  # ──────────────────────────────────────────────────────────
  ssh-check:
    name: SSH Connectivity & Path Detection
    runs-on: ubuntu-latest
    outputs:
      doc_root: ${{ steps.detect.outputs.doc_root }}
      backend_path: ${{ steps.detect.outputs.backend_path }}
      base_path: ${{ steps.detect.outputs.base_path }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: Install SSH client & tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass openssh-client

      - name: Configure SSH Authentication
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_hostinger
            chmod 600 ~/.ssh/id_hostinger
            SSH_AUTH_CONFIG="IdentityFile ~/.ssh/id_hostinger"
          fi
          {
            echo "Host production"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  LogLevel ERROR"
            if [ -n "$SSH_AUTH_CONFIG" ]; then
              echo "  $SSH_AUTH_CONFIG"
            fi
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Test Remote Connection & Setup Paths
        id: detect
        run: |
          RUN_SSH() {
            if [ -n "$SSH_KEY" ]; then
              ssh production "$@"
            else
              sshpass -p "$SSH_PASSWORD" ssh production "$@"
            fi
          }

          echo "Probando conexión SSH con Hostinger..."
          RUN_SSH "echo 'SSH exitoso.'"

          DOC_ROOT="/home/$SSH_USER/domains/catalogo.tiendaintima.com/public_html"
          BACKEND_PATH="/home/$SSH_USER/backend_php"
          BASE_PATH="/home/$SSH_USER/domains/catalogo.tiendaintima.com"

          echo "Rutas fijadas en Hostinger:"
          echo " - DOC_ROOT:     $DOC_ROOT"
          echo " - BACKEND_PATH: $BACKEND_PATH"
          echo " - BASE_PATH:    $BASE_PATH"

          RUN_SSH "mkdir -p '$DOC_ROOT' '$BACKEND_PATH' && chmod 755 '$BASE_PATH' '$DOC_ROOT' '$BACKEND_PATH' 2>/dev/null || true"

          echo "doc_root=$DOC_ROOT" >> "$GITHUB_OUTPUT"
          echo "backend_path=$BACKEND_PATH" >> "$GITHUB_OUTPUT"
          echo "base_path=$BASE_PATH" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────
  # 2. DEPLOY FRONTEND (SPA)
  # ──────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (SPA)
    needs: [ssh-check]
    if: needs.ssh-check.result == 'success'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      DOC_ROOT: ${{ needs.ssh-check.outputs.doc_root }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Frontend Directory
        id: locate
        run: |
          if [ -d "front" ]; then
            echo "dir=front" >> $GITHUB_OUTPUT
          elif [ -d "frontend" ]; then
            echo "dir=frontend" >> $GITHUB_OUTPUT
          else
            echo "::error::No se encontró directorio frontend."
            exit 1
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ steps.locate.outputs.dir }}/package-lock.json

      - name: Install NPM Dependencies
        run: |
          cd ${{ steps.locate.outputs.dir }}
          npm ci --prefer-offline

      - name: Build Frontend (Production)
        run: |
          cd ${{ steps.locate.outputs.dir }}
          npm run build -- --configuration production

      - name: Install SSH and Rsync tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync openssh-client

      - name: Configure SSH Host Profile
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_hostinger
            chmod 600 ~/.ssh/id_hostinger
            SSH_AUTH_CONFIG="IdentityFile ~/.ssh/id_hostinger"
          fi
          {
            echo "Host production"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  LogLevel ERROR"
            if [ -n "$SSH_AUTH_CONFIG" ]; then
              echo "  $SSH_AUTH_CONFIG"
            fi
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy Frontend via Rsync
        run: |
          RUN_RSYNC() {
            if [ -n "$SSH_KEY" ]; then
              rsync -avz --chmod=D755,F644 "$@"
            else
              sshpass -p "$SSH_PASSWORD" rsync -avz --chmod=D755,F644 "$@"
            fi
          }

          TARGET_DOCROOT="${DOC_ROOT:-/home/$SSH_USER/domains/catalogo.tiendaintima.com/public_html}"
          if [ -z "$TARGET_DOCROOT" ] || [ "$TARGET_DOCROOT" = "/" ] || [ "$TARGET_DOCROOT" = "." ]; then
            echo "::error::TARGET_DOCROOT inválido: '$TARGET_DOCROOT'. Abortando."
            exit 1
          fi

          FDIR="${{ steps.locate.outputs.dir }}"
          DIST_DIR=""
          if [ -d "$FDIR/dist/front/browser" ]; then
            DIST_DIR="$FDIR/dist/front/browser"
          elif [ -d "$FDIR/dist/frontend/browser" ]; then
            DIST_DIR="$FDIR/dist/frontend/browser"
          elif [ -d "$FDIR/dist/browser" ]; then
            DIST_DIR="$FDIR/dist/browser"
          elif [ -d "$FDIR/dist/front" ]; then
            DIST_DIR="$FDIR/dist/front"
          elif [ -d "$FDIR/dist/frontend" ]; then
            DIST_DIR="$FDIR/dist/frontend"
          elif [ -d "$FDIR/dist" ]; then
            DIST_DIR="$FDIR/dist"
          fi

          echo "Directorio de compilación detectado: $DIST_DIR"
          echo "Contenido generado:"
          ls -la "$DIST_DIR"

          echo "Sincronizando frontend hacia $TARGET_DOCROOT/..."

          RUN_RSYNC --delete \
            --filter='protect /api' \
            --filter='protect /api/**' \
            --filter='protect /backend_php' \
            --filter='protect /backend_php/**' \
            "$DIST_DIR/" production:"$TARGET_DOCROOT/"

          if [ -f "$FDIR/public/.htaccess" ]; then
            RUN_RSYNC "$FDIR/public/.htaccess" production:"$TARGET_DOCROOT/.htaccess"
          fi

          echo "Frontend sincronizado exitosamente."

  # ──────────────────────────────────────────────────────────
  # 3. DEPLOY BACKEND (PHP Core Fuera de public_html + API Bridge)
  # ──────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend & API Bridge
    needs: [ssh-check, deploy-frontend]
    if: needs.ssh-check.result == 'success'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DOC_ROOT: ${{ needs.ssh-check.outputs.doc_root }}
      BACKEND_PATH: ${{ needs.ssh-check.outputs.backend_path }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Backend Directory
        id: locate
        run: |
          if [ -d "backend-php" ]; then
            echo "dir=backend-php" >> $GITHUB_OUTPUT
          elif [ -d "backend" ]; then
            echo "dir=backend" >> $GITHUB_OUTPUT
          else
            echo "::error::No se encontró directorio backend."
            exit 1
          fi

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, json, curl
          coverage: none

      - name: Install Composer Dependencies (Production)
        run: |
          cd ${{ steps.locate.outputs.dir }}
          composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Validate No .env In Repository
        run: |
          BDIR="${{ steps.locate.outputs.dir }}"
          if git ls-files --error-unmatch "$BDIR/.env" 2>/dev/null; then
            echo "::error::Archivo $BDIR/.env rastreado en Git. Deteniendo por seguridad."
            exit 1
          fi

      - name: Install SSH and Rsync tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync openssh-client

      - name: Configure SSH Host Profile
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_hostinger
            chmod 600 ~/.ssh/id_hostinger
            SSH_AUTH_CONFIG="IdentityFile ~/.ssh/id_hostinger"
          fi
          {
            echo "Host production"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  LogLevel ERROR"
            if [ -n "$SSH_AUTH_CONFIG" ]; then
              echo "  $SSH_AUTH_CONFIG"
            fi
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy Backend Core to Isolated Directory
        run: |
          RUN_RSYNC() {
            if [ -n "$SSH_KEY" ]; then
              rsync -avz --chmod=D755,F644 "$@"
            else
              sshpass -p "$SSH_PASSWORD" rsync -avz --chmod=D755,F644 "$@"
            fi
          }

          TARGET_BACKEND="${BACKEND_PATH:-/home/$SSH_USER/backend_php}"
          if [ -z "$TARGET_BACKEND" ] || [ "$TARGET_BACKEND" = "/" ] || [ "$TARGET_BACKEND" = "." ]; then
            echo "::error::TARGET_BACKEND inválido: '$TARGET_BACKEND'. Abortando."
            exit 1
          fi

          BDIR="${{ steps.locate.outputs.dir }}"
          echo "Desplegando en carpeta privada $TARGET_BACKEND/..."
          RUN_RSYNC --delete \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='uploads/' \
            --exclude='.git*' \
            "$BDIR/" production:"$TARGET_BACKEND/"

      - name: Configure Remote .env, Generate API Bridge & Set Permissions
        run: |
          TARGET_DOCROOT="${DOC_ROOT:-/home/$SSH_USER/domains/catalogo.tiendaintima.com/public_html}"
          TARGET_BACKEND="${BACKEND_PATH:-/home/$SSH_USER/backend_php}"

          chmod +x .github/scripts/remote-deploy.sh
          if [ -n "$SSH_KEY" ]; then
            ssh production "bash -s -- '$TARGET_BACKEND' '$TARGET_DOCROOT' '$DB_NAME' '$DB_USER' '$DB_PASSWORD'" < .github/scripts/remote-deploy.sh
          else
            sshpass -p "$SSH_PASSWORD" ssh production "bash -s -- '$TARGET_BACKEND' '$TARGET_DOCROOT' '$DB_NAME' '$DB_USER' '$DB_PASSWORD'" < .github/scripts/remote-deploy.sh
          fi

      - name: Verify Live API Health
        run: |
          echo "Verificando endpoint de salud de la API..."
          sleep 3
          HEALTH_URL="https://catalogo.tiendaintima.com/api/health"
          echo "Probando: $HEALTH_URL"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
          echo "HTTP Status Code: $STATUS_CODE"

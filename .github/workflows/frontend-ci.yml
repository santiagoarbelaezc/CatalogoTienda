name: Frontend CI (SPA)

on:
  push:
    branches: [main, master]
    paths:
      - 'front/**'
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'front/**'
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build-check:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Frontend Directory
        id: locate
        run: |
          if [ -d "front" ]; then
            echo "dir=front" >> $GITHUB_OUTPUT
          elif [ -d "frontend" ]; then
            echo "dir=frontend" >> $GITHUB_OUTPUT
          else
            echo "::error::No se encontró directorio del frontend."
            exit 1
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ steps.locate.outputs.dir }}/package-lock.json

      - name: Install Dependencies
        run: |
          cd ${{ steps.locate.outputs.dir }}
          npm ci --prefer-offline

      - name: Build Production
        run: |
          cd ${{ steps.locate.outputs.dir }}
          npm run build -- --configuration production

      - name: Verify Build Artifacts
        run: |
          FDIR="${{ steps.locate.outputs.dir }}"
          if [ ! -d "$FDIR/dist" ]; then
            echo "::error::Directorio $FDIR/dist no fue generado."
            exit 1
          fi


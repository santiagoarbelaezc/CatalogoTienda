<div class="top-filters-wrapper">

  <!-- Main Horizontal Filters Bar -->
  <div class="top-filters-bar">

    <!-- 2. Dropdown Categorías -->
    <div class="filter-popover-wrapper">
      <button
        type="button"
        class="filter-trigger-btn"
        [class.active]="filters.categoriaId !== null"
        [class.is-open]="openPopover === 'categoria'"
        (click)="togglePopover('categoria', $event)">
        <span class="material-symbols-rounded trigger-icon">category</span>
        <span class="trigger-label">
          {{ filters.categoriaId !== null ? getSelectedCategoryNombre() : 'Categorías' }}
        </span>
        <span class="material-symbols-rounded trigger-arrow">
          {{ openPopover === 'categoria' ? 'expand_less' : 'expand_more' }}
        </span>
      </button>

      <!-- Popover Menu Categorías -->
      <div class="filter-popover-menu cat-popover animate-scale-in" *ngIf="openPopover === 'categoria'">
        <div class="popover-header">
          <span class="popover-title">Categorías</span>
          <button *ngIf="filters.categoriaId !== null" (click)="clearCategory()" class="popover-clear-btn" type="button">
            Limpiar
          </button>
        </div>

        <div class="popover-cat-list">
          <!-- Todas -->
          <button
            type="button"
            (click)="selectCategory(null); closePopovers()"
            class="popover-cat-item"
            [class.active]="filters.categoriaId === null">
            <span class="material-symbols-rounded item-icon">apps</span>
            <span>Todas las categorías</span>
          </button>

          <!-- Lista -->
          <div *ngFor="let cat of categorias" class="popover-cat-group">
            <!-- Padre con subcategorías -->
            <div *ngIf="cat.subcategorias && cat.subcategorias.length > 0" class="popover-parent-row"
                 [class.active]="filters.categoriaId === cat.id">
              <button
                type="button"
                (click)="selectCategory(cat.id)"
                class="popover-cat-item parent-btn"
                [class.active]="filters.categoriaId === cat.id">
                <span class="material-symbols-rounded item-icon">folder_open</span>
                <span>{{ cat.nombre }}</span>
              </button>
              <button
                type="button"
                class="popover-chevron-btn"
                [class.is-expanded]="isExpanded(cat.id)"
                (click)="toggleExpand(cat.id, $event)">
                <span class="material-symbols-rounded">
                  {{ isExpanded(cat.id) ? 'expand_more' : 'chevron_right' }}
                </span>
              </button>
            </div>

            <!-- Subcategorías desplegadas -->
            <div *ngIf="cat.subcategorias && cat.subcategorias.length > 0 && isExpanded(cat.id)" class="popover-sub-list animate-fade-in">
              <button
                *ngFor="let sub of cat.subcategorias"
                type="button"
                (click)="selectCategory(sub.id); closePopovers()"
                class="popover-sub-item"
                [class.active]="filters.categoriaId === sub.id">
                <span class="sub-dot"></span>
                <span>{{ sub.nombre }}</span>
              </button>
            </div>

            <!-- Padre sin subcategorías -->
            <button
              *ngIf="!cat.subcategorias || cat.subcategorias.length === 0"
              type="button"
              (click)="selectCategory(cat.id); closePopovers()"
              class="popover-cat-item"
              [class.active]="filters.categoriaId === cat.id">
              <span class="material-symbols-rounded item-icon">label</span>
              <span>{{ cat.nombre }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Dropdown Tallas -->
    <div class="filter-popover-wrapper">
      <button
        type="button"
        class="filter-trigger-btn"
        [class.active]="filters.tallaId !== null"
        [class.is-open]="openPopover === 'talla'"
        (click)="togglePopover('talla', $event)">
        <span class="material-symbols-rounded trigger-icon">straighten</span>
        <span class="trigger-label">
          {{ filters.tallaId !== null ? 'Talla: ' + getSelectedTallaNombre() : 'Tallas' }}
        </span>
        <span class="material-symbols-rounded trigger-arrow">
          {{ openPopover === 'talla' ? 'expand_less' : 'expand_more' }}
        </span>
      </button>

      <!-- Popover Menu Tallas -->
      <div class="filter-popover-menu talla-popover animate-scale-in" *ngIf="openPopover === 'talla'">
        <div class="popover-header">
          <span class="popover-title">Filtrar por Talla</span>
          <button *ngIf="filters.tallaId !== null" (click)="clearTalla()" class="popover-clear-btn" type="button">
            Limpiar
          </button>
        </div>

        <div class="popover-talla-body">
          <span class="talla-section-label">Tipo de prenda:</span>
          <div class="popover-garment-types">
            <button
              type="button"
              *ngFor="let g of tallaGroups"
              class="popover-type-pill"
              [class.active]="selectedGarmentGroupId === g.id"
              (click)="selectGarmentGroup(g.id)">
              <span>{{ g.shortName }}</span>
              <span class="material-symbols-rounded chevron-mini">
                {{ selectedGarmentGroupId === g.id ? 'expand_less' : 'expand_more' }}
              </span>
            </button>
          </div>

          <!-- Rejilla de tallas desplegadas -->
          <div class="popover-talla-grid animate-fade-in" *ngIf="selectedGarmentGroupId !== null">
            <button
              *ngFor="let t of activeTallas"
              type="button"
              (click)="selectTalla(t.id); closePopovers()"
              class="popover-talla-btn"
              [class.active]="filters.tallaId === t.id">
              {{ t.nombre }}
            </button>
          </div>

          <!-- Hint cuando no hay grupo seleccionado -->
          <div class="popover-talla-hint" *ngIf="selectedGarmentGroupId === null">
            <span class="material-symbols-rounded hint-icon">touch_app</span>
            <span>Selecciona un tipo para ver sus tallas</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. Segmentado Género -->
    <div class="filter-seg-gender">
      <button
        *ngFor="let gen of ['', 'Hombre', 'Mujer']"
        type="button"
        (click)="filters.genero = gen; emitFilters()"
        class="seg-gender-btn"
        [class.active]="filters.genero === gen">
        {{ gen === '' ? 'Todos' : gen }}
      </button>
    </div>

    <!-- 5. Marca Select -->
    <div class="filter-select-wrapper" *ngIf="marcas.length > 0">
      <select [(ngModel)]="filters.marcaId" (change)="emitFilters()" class="filter-select-control">
        <option [ngValue]="null">Todas las marcas</option>
        <option *ngFor="let m of marcas" [ngValue]="m.id">{{ m.nombre }}</option>
      </select>
    </div>

    <!-- 6. Ordenar Select -->
    <div class="filter-select-wrapper">
      <select [(ngModel)]="filters.sortBy" (change)="emitFilters()" class="filter-select-control">
        <option value="name-asc">Nombre: A-Z</option>
        <option value="name-desc">Nombre: Z-A</option>
        <option value="price-asc">Precio: Menor a Mayor</option>
        <option value="price-desc">Precio: Mayor a Menor</option>
      </select>
    </div>

    <!-- 7. Reset Button -->
    <button
      type="button"
      *ngIf="hasActiveFilters()"
      (click)="resetFilters()"
      class="filter-reset-btn animate-fade-in"
      title="Restablecer todos los filtros">
      <span class="material-symbols-rounded">restart_alt</span>
      <span class="reset-text">Limpiar</span>
    </button>

  </div>

  <!-- Active Badges Bar (Removibles) -->
  <div class="active-chips-row animate-fade-in" *ngIf="hasActiveFilters()">
    <span class="chips-label">Filtros activos:</span>

    <span class="active-chip" *ngIf="filters.searchQuery">
      <span>"{{ filters.searchQuery }}"</span>
      <button type="button" (click)="filters.searchQuery = ''; emitFilters()" class="chip-remove">✕</button>
    </span>

    <span class="active-chip" *ngIf="filters.categoriaId !== null">
      <span>Categoría: {{ getSelectedCategoryNombre() }}</span>
      <button type="button" (click)="clearCategory()" class="chip-remove">✕</button>
    </span>

    <span class="active-chip" *ngIf="filters.tallaId !== null">
      <span>Talla: {{ getSelectedTallaNombre() }}</span>
      <button type="button" (click)="clearTalla()" class="chip-remove">✕</button>
    </span>

    <span class="active-chip" *ngIf="filters.genero">
      <span>Género: {{ filters.genero }}</span>
      <button type="button" (click)="filters.genero = ''; emitFilters()" class="chip-remove">✕</button>
    </span>

    <span class="active-chip" *ngIf="filters.marcaId !== null">
      <span>Marca: {{ getSelectedMarcaNombre() }}</span>
      <button type="button" (click)="filters.marcaId = null; emitFilters()" class="chip-remove">✕</button>
    </span>

    <button type="button" (click)="resetFilters()" class="chip-clear-all">
      Limpiar todos
    </button>
  </div>

</div>

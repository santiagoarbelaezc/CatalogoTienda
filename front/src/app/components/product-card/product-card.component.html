<div class="product-card animate-scale-in">

  <!-- Image Gallery Section -->
  <div class="card-gallery">
    <div class="main-image-wrap">
      <!-- Minimalist Black Badge -->
      <div class="image-tags">
        <span class="tag tag-bestseller">MÁS VENDIDO</span>
        <span class="tag tag-gender" *ngIf="product.genero">{{ product.genero }}</span>
      </div>

      <img
        *ngIf="product.imagenes && product.imagenes.length > 0 && product.imagenes[activeImageIndex]"
        [src]="product.imagenes[activeImageIndex].url"
        [alt]="product.nombre"
        class="main-image">

      <div *ngIf="!product.imagenes || product.imagenes.length === 0" class="no-image-placeholder">
        <span class="material-symbols-rounded icon-no-img">image_not_supported</span>
        <span class="text-no-img">Sin imagen</span>
      </div>
    </div>

    <!-- Minimalist Image Thumbnails -->
    <div class="thumbnails" *ngIf="product.imagenes.length > 1">
      <button
        *ngFor="let img of product.imagenes; let idx = index"
        (click)="activeImageIndex = idx"
        class="thumb-btn"
        [class.active]="activeImageIndex === idx">
        <img [src]="img.url" class="thumb-img">
      </button>
    </div>
  </div>

  <!-- Content & Details Section -->
  <div class="card-details">
    <div class="details-content">

      <!-- Category Tag Kicker -->
      <div class="kicker-row">
        <span class="category-kicker">{{ product.categoria.nombre }}</span>
        <span class="brand-kicker" *ngIf="product.marca">· {{ product.marca.nombre }}</span>
      </div>

      <!-- Product Name -->
      <h2 class="product-name">{{ product.nombre }}</h2>

      <!-- Color Swatches Row -->
      <div class="variants-row" *ngIf="availableColors.length > 0">
        <span class="variants-label">Colores:</span>
        <div class="color-dots">
          <button
            *ngFor="let col of availableColors"
            (click)="selectColor(col)"
            [style.background-color]="col.hex"
            [class.selected]="selectedColor?.id === col.id"
            class="color-dot"
            [title]="col.nombre">
          </button>
        </div>
      </div>

      <!-- Tallas List Row -->
      <div class="tallas-text-row" *ngIf="availableTallas.length > 0">
        <span class="variants-label">Tallas:</span>
        <div class="talla-chips">
          <button
            *ngFor="let t of availableTallas"
            (click)="selectTalla(t)"
            class="talla-chip"
            [class.active]="selectedTalla?.id === t.id"
            [class.disabled]="selectedColor && !hasVariant(selectedColor, t)">
            {{ t.nombre }}
          </button>
        </div>
      </div>

    </div>

    <!-- Divider Line -->
    <div class="card-divider"></div>

    <!-- Footer: Price -->
    <div class="card-footer-row">
      <div class="price-display">
        <span class="price-label-prefix">Precio:</span>
        <span class="price-val">{{ formatPrice(currentPrice > 0 ? currentPrice : product.precio_base) }}</span>
      </div>
    </div>

    <!-- Action Button -->
    <div class="action-row">
      <button
        (click)="sendWhatsAppDirect()"
        class="btn-whatsapp">
        <span class="material-symbols-rounded">chat</span>
        Consultar por WhatsApp
      </button>
    </div>

  </div>

</div>
